[package]
name = "ochrell"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Independent, spectrally derived RGB pigment mixing with reproducible synthetic pigments"
readme = "README.md"
exclude = ["results/**", "paper/**", "examples/comparisons/**", "comparisons/**"]

[lib]
name = "ochrell"

[[bench]]
name = "mixing"
harness = false

[profile.release]
lto = false
codegen-units = 1
